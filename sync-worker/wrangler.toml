name = "ahh-insights-sync"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

# 6:30 AM IST every day
[triggers]
crons = ["0 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ahh-approvals"
database_id = "19ac32fd-cb4e-4ee5-a329-b7d3ae5704d5"

[vars]
IG_USER_ID = ""
AD_ACCOUNT_ID = ""
# META_ACCESS_TOKEN is a secret, added in the Cloudflare dashboard
