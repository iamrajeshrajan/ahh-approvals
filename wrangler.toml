name = "ahh-approvals"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "ahh-approvals"
database_id = "19ac32fd-cb4e-4ee5-a329-b7d3ae5704d5"
migrations_dir = "migrations"

# File storage for creatives (reels and images)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ahh-approvals-media"

# Nightly Meta sync job (separate Worker in sync-worker/), reached only through this binding
[[services]]
binding = "SYNC"
service = "ahh-insights-sync"
